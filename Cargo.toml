[package]
name = "audioserver"
version = "0.1.0"
edition = "2021"
default-run = "audioserver"

[dependencies]
# 异步运行时
tokio = { version = "1.36", features = ["full"] }

# WebSocket 服务
tokio-tungstenite = "0.21"
futures-util = "0.3"

# JPEG 解码（手机上行摄像头帧 → RGBA）
jpeg-decoder = "0.3"

# 跨平台音频捕获（备用）
cpal = "0.15"

# 错误处理
anyhow = "1.0"

# 日志
log = "0.4"
env_logger = "0.11"

# GUI
eframe = "0.29"

# 网络接口 - 获取本机 IP
local-ip-address = "0.6"

# CLI 参数 (仅 server 二进制使用)
clap = { version = "4.5", features = ["derive"] }
rust-i18n = "4.2.4"

# ===== 以下是真正的 Windows 专属依赖（TOML 分节规则：表格标题到下一个标题为止）=====
# v3.5 修复：以前这些跨平台依赖误写在本节内部，导致 Mac 目标 cargo check 全部找不到 crate
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    # v3.4 摄像头：UnityCapture 共享内存发送端需要（文件映射/事件/互斥量）
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_WindowsProgramming",
    # vcam_probe：以应用视角枚举 DirectShow 视频输入设备
    "Win32_Media_DirectShow",
    "Win32_System_Com_StructuredStorage",
    # v3.4 双通道：OBS 虚拟摄像头通道用隐私监控注册表检测"有应用正在看摄像头"
    "Win32_System_Registry",
    # i18n：读系统显示语言（GetUserDefaultUILanguage），决定界面默认中/英
    "Win32_Globalization",
    # GUI exe 默认无控制台窗口；PCSPEAKER_CONSOLE=1 时用 AllocConsole/AttachConsole 开回来
    "Win32_System_Console",
] }

# ===== macOS 专属依赖（v3.5 Mac 移植）=====
[target.'cfg(target_os = "macos")'.dependencies]
# 裸 CoreAudio FFI：设备枚举/设备名/IsRunningSomewhere 占用属性（mic_out 的 Mac 检测用）
# 与 cpal 内部所用绑定同源，不会引入第二套版本
coreaudio-sys = "0.2"
# CFString → Rust String 转换的最小 CoreFoundation 绑定
core-foundation-sys = "0.8"

# GUI 默认二进制
[[bin]]
name = "audioserver"
path = "src/main.rs"

# CLI 无界面服务器
[[bin]]
name = "server"
path = "src/bin/server.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
