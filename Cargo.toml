[package]
name = "audioserver"
version = "0.1.0"
edition = "2021"

[dependencies]
# 异步运行时
tokio = { version = "1.36", features = ["full"] }

# WebSocket 服务
tokio-tungstenite = "0.21"
futures-util = "0.3"

# 音频捕获
cpal = "0.15"

# 错误处理
anyhow = "1.0"

# 日志
log = "0.4"
env_logger = "0.11"

# 命令行参数
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
