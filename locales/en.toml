# ============================================================================
# AudioServer 界面文案 —— 英文（fallback 语言，缺键时全界面回退到这里）
# ----------------------------------------------------------------------------
# · 键名 = 代码里的 t("section.key")
# · {name} 是占位符，由 i18n::tf() 在运行时替换（不用 rust-i18n 的 %{name}，
#   因为我们的 key 是运行时变量，走不了它编译期插值的宏）
# · 必须和 zh.toml 一一对应；改这里就顺手改那边，单测 i18n_key_parity 会盯住
# · WiFi / USB / IP / WebSocket / PCM / Hz / kbps / fps 这类全球通用缩写不翻译，
#   两边保持同字（见 zh.toml 同键）
# ============================================================================

