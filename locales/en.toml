[guide]
title = "First run: drivers needed"
intro = "This program is one portable file: it writes nothing to the registry, ships no install\nscript and never installs anything for you.\nBut using the phone as a PC microphone / camera needs virtual drivers inside Windows. While\nthey are missing this program will not start the server at all — otherwise you would only\nfind out there is no device after the phone had already connected.\nInstall what is marked red below, then press [Re-check] to enter the main window."
vb_title = "VB-CABLE virtual audio cable  [required for Mic Mode]"
vb_ok = "CABLE Input / CABLE Output found in the device list"
vb_missing = "No CABLE Input / CABLE Output in the PC sound-device list"
vb_btn = "Open the VB-CABLE download page"
vb_hover = "Download VB-CABLE's Driver.exe and run it as administrator"
vb_steps = "Steps: download → right-click \"Run as administrator\" → a reboot afterwards is recommended;\nthen set your meeting app's [input device] to CABLE Output."
cam_title = "Virtual camera driver  [required for Camera Mode, either one]"
cam_both = "Both present: desktop apps use Unity Video Capture, browsers use OBS Virtual Camera"
cam_unity_only = "Unity Video Capture is installed (browsers only accept OBS Virtual Camera — add OBS when needed)"
cam_obs_only = "OBS Virtual Camera is installed, ready to use"
cam_none = "Neither is installed: the phone picture cannot become a PC webcam"
cam_btn_obs = "Open the OBS Studio download page"
cam_hover_obs = "The easiest route: install OBS Studio, it ships OBS Virtual Camera"
cam_btn_unity = "Open the Unity Capture project page"
cam_hover_unity = "After downloading and unzipping: right-click Install\\Install.bat and run it as administrator"
cam_note = "This program will not install any driver for you and ships no install script — it only\ndetects and tells you what is missing.\nThe difference between the two drivers: Unity is a DirectShow filter, selectable in\nDingTalk / Tencent Meeting / OBS; Edge and Chrome browsers only accept OBS Virtual Camera\n(install OBS and it is there, no extra configuration)."
fs_running = "Windows Camera Frame Server is running"
fs_stopped = "Note: Windows Camera Frame Server is not running. Browsers will see zero cameras\n(services.msc → Windows Camera Frame Server → Start). Desktop meeting apps are unaffected."
