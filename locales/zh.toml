# ============================================================================
# AudioServer 界面文案 —— 简体中文
# ----------------------------------------------------------------------------
# 键必须与 en.toml 完全一致（少一个键就退回英文，多一个键没人用）。
# WiFi / USB / IP / WebSocket / PCM / Hz / kbps / fps 这类全球通用缩写不翻译，
# 与英文保持同字；驱动名（VB-CABLE、OBS Virtual Camera、Unity Video Capture、
# CABLE Input/Output）是系统里真实显示的设备名，翻了就选不到了，所以一律保留原文。
# ============================================================================

